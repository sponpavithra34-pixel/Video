<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Special Video ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #ffd6e7,
                #e8d7ff
            );
        }

        .card {
            width: 100%;
            max-width: 600px;

            background: white;

            padding: 25px;

            border-radius: 25px;

            text-align: center;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.15);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
        }

        video {
            width: 100%;

            margin-top: 20px;

            border-radius: 18px;
        }

        .footer {
            margin-top: 25px;
        }

    </style>

</head>

<body>

    <div class="card">

        <h1>Special Video ❤️</h1>

        <p>
            A beautiful memory just for you ✨
        </p>

        <video controls>

            <source
                src="video.mp4"
                type="video/mp4">

            Your browser does not support
            video playback.

        </video>

        <p class="footer">
            Made with ❤️
        </p>

    </div>

</body>

          </html>
